[project]
name = "ai-gateway"
version = "0.1.0"
description = "FastAPI gateway in front of LiteLLM"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.142.2",
  "httpx==0.28.1",
  "pydantic==2.13.5",
  "ruamel.yaml==0.18.10",
  "pytest==9.1.1",
  "uvicorn==0.54.0",
  "prometheus-client>=0.26.0",
  "redis>=8.1.0",
  "opentelemetry-api>=1.45.0",
  "opentelemetry-sdk>=1.45.0",
  "opentelemetry-exporter-otlp-proto-grpc>=1.45.0",
  "opentelemetry-instrumentation-fastapi>=0.66b0",
  "opentelemetry-instrumentation-httpx>=0.66b0",
  "python-multipart>=0.0.34",
]

[project.scripts]
intelliway-model = "gateway.model_config:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
benchmark = [
    "pandas>=2.2",
    "pyarrow>=18",
]
