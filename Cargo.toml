[workspace]
resolver ="3"
members = ["intelliway-db","intelliway-gateway", "intelliway-router"]

[workspace.dependencies]
async-trait = "0.1"
axum = "0.8"
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["full"] }
toml = "1.1"
tracing = "0.1"
tracing-subscriber = "0.3"
uuid = { version = "1.26", features = ["v4", "serde"] }
diesel = { version = "2.3", features = ["postgres", "r2d2", "chrono"] }

intelliway-gateway = { path = "intelliway-gateway" }
intelliway-router = { path = "intelliway-router" }
