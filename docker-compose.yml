services:
  ollama:
    image: ollama/ollama:latest
    container_name: intelliway-ollama
    restart: unless-stopped
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    healthcheck:
      test: ["CMD-SHELL", "ollama list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks:
      - litellm-net

  litellm:
    image: ghcr.io/berriai/litellm:latest
    container_name: litellm-proxy
    restart: unless-stopped
    ports:
      - "127.0.0.1:4000:4000"
    volumes:
      - ./litellm/config.yaml:/app/config.yaml:ro
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@timescaledb:5432/${POSTGRES_DB}
      - STORE_MODEL_IN_DB=True
      - OLLAMA_BASE_URL=http://ollama:11434
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command:
      - "--config"
      - "/app/config.yaml"
      - "--port"
      - "4000"
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
      ollama:
        condition: service_started
    networks:
      - litellm-net

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: litellm-timescaledb
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - litellm-net

  redis:
    image: redis:7-alpine
    container_name: litellm-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - litellm-net

  semantic-router:
    image: ghcr.io/vllm-project/semantic-router/vllm-sr:latest
    container_name: vllm-semantic-router
    restart: unless-stopped
    ports:
      - "127.0.0.1:8899:8899"
    volumes:
      - ./semantic-router/config.yaml:/app/config/config.yaml:ro
    environment:
      - CONFIG_FILE=/app/config/config.yaml
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
    command:
      - "--gateway=standalone"
    depends_on:
      - litellm
    networks:
      - litellm-net

  gateway:
    build: .
    container_name: intelliway-gateway
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    volumes:
      - ./litellm/config.yaml:/app/litellm/config.yaml:ro
      - ./evidence:/app/evidence
    environment:
      - LITELLM_URL=http://litellm:4000
      - SEMANTIC_ROUTER_URL=http://semantic-router:8899
      - GATEWAY_REDIS_HOST=redis
      - GATEWAY_REDIS_PORT=6379
      - GATEWAY_REDIS_PASSWORD=${REDIS_PASSWORD}
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=intelliway-gateway
    command: ["uvicorn", "gateway.main:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://127.0.0.1:8000/health/ready\")'"]
      interval: 10s
      timeout: 5s
      retries: 12
    depends_on:
      - litellm
      - semantic-router
    networks:
      - litellm-net

  chat-app:
    build: ./chat-app
    container_name: intelliway-chat-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - .env
    environment:
      - PORT=3000
      - LITELLM_BASE_URL=http://litellm:4000
      - SEMANTIC_ROUTER_BASE_URL=http://semantic-router:8899
      - CHAT_MAX_TOKENS=4096
    depends_on:
      - litellm
      - semantic-router
    networks:
      - litellm-net

  https-proxy:
    image: caddy:2-alpine
    container_name: intelliway-https-proxy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      - PUBLIC_DOMAIN=${PUBLIC_DOMAIN:-localhost}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - chat-app
      - gateway
      - litellm
      - semantic-router
    networks:
      - litellm-net

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    container_name: intelliway-jaeger
    restart: unless-stopped
    ports:
      - "127.0.0.1:16686:16686"
    networks:
      - litellm-net

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: intelliway-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./observability/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    networks:
      - litellm-net

  grafana:
    image: grafana/grafana:12.1.1
    container_name: intelliway-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-change-me}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
      - jaeger
    networks:
      - litellm-net

volumes:
  timescaledb_data:
  redis_data:
  ollama_data:
  caddy_data:
  caddy_config:
  prometheus_data:
  grafana_data:

networks:
  litellm-net:
    driver: bridge
