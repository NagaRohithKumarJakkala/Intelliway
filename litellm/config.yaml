general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  database_url: os.environ/DATABASE_URL

  # Redis for rate limiting and state coordination
  redis_host: redis
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD

router_settings:
  routing_strategy: simple-shuffle
  num_retries: 2
  allowed_fails: 2
  cooldown_time: 30
  redis_host: redis
  redis_port: 6379
  redis_password: os.environ/REDIS_PASSWORD

litellm_settings:
  # Response caching via Redis
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD
