model_list:
  - model_name: e2e-mock
    litellm_params:
      model: openai/e2e-mock
      api_base: http://mock-model:8080/v1
      api_key: e2e-placeholder
      rpm: 600
      tpm: 600000
    model_info:
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY

litellm_settings:
  cache: true
  cache_params:
    type: redis
    host: redis
    port: 6379
    password: os.environ/REDIS_PASSWORD

