version: v0.3

listeners:
  - name: http-8899
    address: 0.0.0.0
    port: 8899
    timeout: 300s

providers:
  defaults:
    model: local-general
  models:
    - name: local-general
      provider_model_id: local-general
      api_format: openai
      pricing:
        currency: USD
        prompt_per_1m: 0.0
        completion_per_1m: 0.0
      backend_refs:
        - name: litellm-local
          endpoint: litellm:4000
          provider: openai
          auth_header: Authorization
          auth_prefix: Bearer
          api_key_env: LITELLM_MASTER_KEY
          weight: 100

    - name: local-coder
      provider_model_id: local-coder
      api_format: openai
      pricing:
        currency: USD
        prompt_per_1m: 0.0
        completion_per_1m: 0.0
      backend_refs:
        - name: litellm-local-coder
          endpoint: litellm:4000
          provider: openai
          auth_header: Authorization
          auth_prefix: Bearer
          api_key_env: LITELLM_MASTER_KEY
          weight: 100

    - name: external-general
      provider_model_id: external-general
      api_format: openai
      pricing:
        currency: USD
        prompt_per_1m: 0.075
        completion_per_1m: 0.30
      backend_refs:
        - name: litellm-external-general
          endpoint: litellm:4000
          provider: openai
          auth_header: Authorization
          auth_prefix: Bearer
          api_key_env: LITELLM_MASTER_KEY
          weight: 100

    - name: external-frontier
      provider_model_id: external-frontier
      api_format: openai
      pricing:
        currency: USD
        prompt_per_1m: 1.25
        completion_per_1m: 5.0
      backend_refs:
        - name: litellm-external-frontier
          endpoint: litellm:4000
          provider: openai
          auth_header: Authorization
          auth_prefix: Bearer
          api_key_env: LITELLM_MASTER_KEY
          weight: 100

routing:
  strategy: priority
  modelCards:
    - name: local-general
      context_window_size: 32768
      capabilities: [chat, tools]
    - name: local-coder
      context_window_size: 32768
      capabilities: [chat, tools]
    - name: external-general
      context_window_size: 131072
      capabilities: [chat, tools]
    - name: external-frontier
      context_window_size: 131072
      capabilities: [chat, tools, reasoning]

  signals:
    keywords:
      - name: coding
        operator: OR
        method: bm25
        keywords: [code, python, function, class, debug, algorithm, program]
        case_sensitive: false
        bm25_threshold: 0.1
      - name: complex
        operator: OR
        method: bm25
        keywords: [architecture, distributed, prove, derive, optimize, migration]
        case_sensitive: false
        bm25_threshold: 0.1
    modality:
      - name: AR
        description: Text-only autoregressive requests.
      - name: DIFFUSION
        description: Image-generation requests.
      - name: BOTH
        description: Requests needing both text and image generation.

  decisions:
    - name: local_coding
      description: Route coding requests to the local LiteLLM alias.
      priority: 100
      rules:
        operator: OR
        conditions:
          - type: keyword
            name: coding
      modelRefs:
        - model: local-coder
      algorithm:
        type: static

    - name: complex_external
      description: Route complex requests to the external LiteLLM alias.
      priority: 90
      rules:
        operator: OR
        conditions:
          - type: keyword
            name: complex
      modelRefs:
        - model: external-frontier
      algorithm:
        type: static

    - name: default_local
      description: Route general requests to the local LiteLLM alias.
      priority: 1
      rules:
        operator: OR
        conditions:
          - type: modality
            name: AR
      modelRefs:
        - model: local-general
      algorithm:
        type: static

entrypoints:
  - model_names: [auto, auto-balanced, vllm-sr/auto, vllm-sr/auto-balanced]
    recipe: default
  - model_names: [auto-local, vllm-sr/auto-local]
    recipe: local-only
  - model_names: [auto-cost, vllm-sr/auto-cost]
    recipe: default
  - model_names: [auto-quality, vllm-sr/auto-quality]
    recipe: quality-first

recipes:
  - name: local-only
    description: Keep automatic traffic on local LiteLLM aliases.
    routing:
      strategy: priority
      signals:
        modality:
          - name: AR
            description: Text-only autoregressive requests.
      decisions:
        - name: local_only_default
          priority: 1
          rules:
            operator: AND
            conditions:
              - type: modality
                name: AR
          modelRefs:
            - model: local-general
          algorithm:
            type: static

  - name: quality-first
    description: Prefer the highest quality LiteLLM alias for automatic traffic.
    routing:
      strategy: priority
      signals:
        modality:
          - name: AR
            description: Text-only autoregressive requests.
      decisions:
        - name: quality_first_default
          priority: 1
          rules:
            operator: AND
            conditions:
              - type: modality
                name: AR
          modelRefs:
            - model: external-frontier
          algorithm:
            type: static
